<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: #e0e0e0;
            overflow: hidden;
      }
      h1 {
            font-size: 2rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff8880;
            margin-bottom: 8px;
      }
      #scoreboard {
            display: flex;
            gap: 40px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            letter-spacing: 2px;
      }
      .score-block { text-align: center; }
      .score-label { color: #666; font-size: 0.7rem; }
      .score-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff8840;
      }
      #level-bar-container {
            width: 400px;
            height: 4px;
            background: #1a1a2e;
            border-radius: 2px;
            margin-bottom: 10px;
            overflow: hidden;
      }
      #level-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff88, #00aaff);
            border-radius: 2px;
            transition: width 0.3s ease;
      }
      canvas {
            border: 2px solid #00ff8830;
            border-radius: 6px;
            box-shadow: 0 0 40px #00ff8820, 0 0 80px #00ff8808;
            display: block;
            image-rendering: pixelated;
      }
      #controls {
            margin-top: 14px;
            font-size: 0.72rem;
            color: #444;
            letter-spacing: 1px;
            text-align: center;
      }
      #mobile-controls {
            display: none;
            margin-top: 16px;
            gap: 8px;
            flex-direction: column;
            align-items: center;
      }
      .ctrl-row { display: flex; gap: 8px; }
      .ctrl-btn {
            width: 52px; height: 52px;
            background: #1a1a2e;
            border: 1px solid #00ff8840;
            border-radius: 8px;
            color: #00ff88;
            font-size: 1.2rem;
            cursor: pointer;
            user-select: none;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
      }
      .ctrl-btn:active { background: #00ff8820; }
      @media (max-width: 500px) {
            canvas { width: 320px; height: 320px; }
            #mobile-controls { display: flex; }
            #level-bar-container { width: 320px; }
      }
    </style>
  </head>
  <body>
    <h1>🐍 Snake</h1>
  <div id="scoreboard">
    <div class="score-block">
        <div class="score-label">SCORE</div>div>
        <div class="score-value" id="score-display">0</div>div>
    </div>div>
    <div class="score-block">
        <div class="score-label">BEST</div>div>
        <div class="score-value" id="best-display">0</div>div>
    </div>div>
    <div class="score-block">
        <div class="score-label">LEVEL</div>div>
        <div class="score-value" id="level-display">1</div>div>
    </div>div>
  </div>div>
  <div id="level-bar-container"><div id="level-bar"></div>div></div>div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>canvas>
  <div id="controls">Arrow Keys / WASD to move &nbsp;|&nbsp; P to pause &nbsp;|&nbsp; Enter to start</div>div>
  <div id="mobile-controls">
    <div class="ctrl-row"><button class="ctrl-btn" id="btn-up">▲</button>button></div>div>
    <div class="ctrl-row">
        <button class="ctrl-btn" id="btn-left">◀</button>button>
        <button class="ctrl-btn" id="btn-down">▼</button>button>
        <button class="ctrl-btn" id="btn-right">▶</button>button>
    </div>div>
  </div>div>
  
  <script>
    // ─── CONFIG ────────────────────────────────────────────────
    const COLS = 20, ROWS = 20;
    const CELL = 20;          // px per cell
    const BASE_SPEED = 150;   // ms per tick at level 1
    const SPEED_PER_LVL = 8;  // ms reduction per level
    const FOOD_PER_LEVEL = 5; // food eaten to advance level
    const MAX_LEVEL = 10;

    // ─── STATE ─────────────────────────────────────────────────
    let snake, dir, nextDir, food, specialFood;
    let score, best, level, foodEaten;
    let particles = [];
    let state = 'START';     // START | RUNNING | PAUSED | DEAD
    let lastTick = 0, tickInterval;
    let animId;

    // ─── CANVAS ────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ─── UTILS ─────────────────────────────────────────────────
    const rand = (n) => Math.floor(Math.random() * n);
    const samePos = (a, b) => a.x === b.x && a.y === b.y;
    const onSnake = (pos) => snake.some(s => samePos(s, pos));

    function randomFood() {
        let pos;
        do { pos = { x: rand(COLS), y: rand(ROWS) }; } while (onSnake(pos));
        return pos;
    }

    function getSpeed() {
        return Math.max(60, BASE_SPEED - (level - 1) * SPEED_PER_LVL);
    }

    // ─── PARTICLES ─────────────────────────────────────────────
    function spawnParticles(x, y, color) {
        for (let i = 0; i < 12; i++) {
              const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.5;
              const speed = 1.5 + Math.random() * 2.5;
              particles.push({
                      x: x * CELL + CELL / 2,
                      y: y * CELL + CELL / 2,
                      vx: Math.cos(angle) * speed,
                      vy: Math.sin(angle) * speed,
                      life: 1,
                      color,
                      r: 2 + Math.random() * 3
              });
        }
    }

    function updateParticles() {
        particles = particles.filter(p => {
              p.x += p.vx;
              p.y += p.vy;
              p.vy += 0.1;
              p.life -= 0.04;
              return p.life > 0;
        });
    }

    function drawParticles() {
        particles.forEach(p => {
              ctx.save();
              ctx.globalAlpha = p.life;
              ctx.fillStyle = p.color;
              ctx.shadowColor = p.color;
              ctx.shadowBlur = 6;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
        });
    }

    // ─── DRAW HELPERS ──────────────────────────────────────────
    function drawCell(x, y, color, glow, radius = 3) {
        const px = x * CELL + 1, py = y * CELL + 1;
        const s = CELL - 2;
        ctx.save();
        if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 12; }
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(px, py, s, s, radius);
        ctx.fill();
        ctx.restore();
    }

    function drawEyes(head) {
        const cx = head.x * CELL + CELL / 2;
        const cy = head.y * CELL + CELL / 2;
        const offset = 4;
        let e1, e2;
        if (dir.x === 1)  { e1 = {x:cx+3, y:cy-offset}; e2 = {x:cx+3, y:cy+offset}; }
        else if (dir.x===-1){ e1={x:cx-3,y:cy-offset}; e2={x:cx-3,y:cy+offset}; }
        else if (dir.y===-1){ e1={x:cx-offset,y:cy-3}; e2={x:cx+offset,y:cy-3}; }
        else               { e1={x:cx-offset,y:cy+3}; e2={x:cx+offset,y:cy+3}; }
        ctx.fillStyle = '#0a0a0f';
        [e1, e2].forEach(e => {
              ctx.beginPath();
              ctx.arc(e.x, e.y, 2.2, 0, Math.PI * 2);
              ctx.fill();
        });
        ctx.fillStyle = '#fff';
        [e1, e2].forEach(e => {
              ctx.beginPath();
              ctx.arc(e.x - 0.5, e.y - 0.5, 0.8, 0, Math.PI * 2);
              ctx.fill();
        });
    }

    // ─── OVERLAY SCREENS ───────────────────────────────────────
    function drawOverlay(title, lines) {
        ctx.save();
        ctx.fillStyle = 'rgba(10,10,15,0.82)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = 30;
        ctx.fillStyle = '#00ff88';
        ctx.font = 'bold 28px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 30);

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#aaa';
        ctx.font = '14px Segoe UI';
        lines.forEach((line, i) => {
              ctx.fillText(line, canvas.width / 2, canvas.height / 2 + 10 + i * 24);
        });
        ctx.restore();
    }

    // ─── GRID ──────────────────────────────────────────────────
    function drawGrid() {
        ctx.strokeStyle = '#ffffff06';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= COLS; i++) {
              ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
        }
        for (let j = 0; j <= ROWS; j++) {
              ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(canvas.width, j * CELL); ctx.stroke();
        }
    }

    // ─── FOOD PULSE ANIMATION ──────────────────────────────────
    let pulse = 0;

    function drawFood() {
        pulse += 0.08;
        const glow = 8 + Math.sin(pulse) * 5;
        ctx.save();
        ctx.shadowColor = '#ff4466';
        ctx.shadowBlur = glow;
        ctx.fillStyle = '#ff4466';
        const px = food.x * CELL + 3, py = food.y * CELL + 3, s = CELL - 6;
        ctx.beginPath();
        // Heart shape scaled to cell
        const cx = food.x * CELL + CELL / 2, cy = food.y * CELL + CELL / 2;
        const sc = 6;
        ctx.beginPath();
        ctx.moveTo(cx, cy + sc * 0.6);
        ctx.bezierCurveTo(cx - sc * 1.2, cy - sc * 0.2, cx - sc * 1.6, cy - sc * 1.2, cx, cy - sc * 0.6);
        ctx.bezierCurveTo(cx + sc * 1.6, cy - sc * 1.2, cx + sc * 1.2, cy - sc * 0.2, cx, cy + sc * 0.6);
        ctx.fill();
        ctx.restore();

        // Special food (star) every 5 normal foods
        if (specialFood) {
              ctx.save();
              ctx.shadowColor = '#ffcc00';
              ctx.shadowBlur = 14 + Math.sin(pulse * 1.5) * 6;
              ctx.fillStyle = '#ffcc00';
              drawStar(specialFood.x * CELL + CELL/2, specialFood.y * CELL + CELL/2, 5, CELL/2 - 2, CELL/4);
              ctx.restore();
        }
    }

    function drawStar(cx, cy, spikes, outerR, innerR) {
        let rot = (Math.PI / 2) * 3;
        const step = Math.PI / spikes;
        ctx.beginPath();
        ctx.moveTo(cx, cy - outerR);
        for (let i = 0; i < spikes; i++) {
              ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
              rot += step;
              ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
              rot += step;
        }
        ctx.lineTo(cx, cy - outerR);
        ctx.closePath();
        ctx.fill();
    }

    // ─── SNAKE DRAW ────────────────────────────────────────────
    function drawSnake() {
        snake.forEach((seg, i) => {
              const t = i / snake.length;
              const r = Math.round(lerp(0, 0, t));
              const g = Math.round(lerp(255, 160, t));
              const b = Math.round(lerp(136, 60, t));
              const color = `rgb(${r},${g},${b})`;
              drawCell(seg.x, seg.y, color, i === 0, i === 0 ? 5 : 3);
        });
        if (snake.length > 0) drawEyes(snake[0]);
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

    // ─── INIT / RESET ──────────────────────────────────────────
    function init() {
        snake = [
          { x: 10, y: 10 },
          { x: 9,  y: 10 },
          { x: 8,  y: 10 }
            ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        level = 1;
        foodEaten = 0;
        particles = [];
        specialFood = null;
        food = randomFood();
        best = parseInt(localStorage.getItem('snakeBest') || '0');
        updateHUD();
        state = 'RUNNING';
        lastTick = performance.now();
    }

    // ─── HUD ───────────────────────────────────────────────────
    function updateHUD() {
        document.getElementById('score-display').textContent = score;
        document.getElementById('best-display').textContent = best;
        document.getElementById('level-display').textContent = level;
        const pct = Math.min(100, (foodEaten % FOOD_PER_LEVEL) / FOOD_PER_LEVEL * 100);
        document.getElementById('level-bar').style.width = pct + '%';
    }

    // ─── GAME TICK ─────────────────────────────────────────────
    function tick() {
        dir = { ...nextDir };
        const head = { x: (snake[0].x + dir.x + COLS) % COLS,
                                        y: (snake[0].y + dir.y + ROWS) % ROWS };

        // Wall collision (disabled: wrap-around)
        // Self collision
        if (snake.slice(1).some(s => samePos(s, head))) {
              die(); return;
        }

        snake.unshift(head);

        // Eat food
        if (samePos(head, food)) {
              score += level * 10;
              foodEaten++;
              spawnParticles(food.x, food.y, '#ff4466');
              food = randomFood();

              // Level up
              if (foodEaten % FOOD_PER_LEVEL === 0 && level < MAX_LEVEL) {
                      level++;
                      flashLevel();
              }

              // Spawn special food every 5 normal foods
              if (foodEaten % 5 === 0 && !specialFood) {
                      let sf;
                      do { sf = { x: rand(COLS), y: rand(ROWS) }; }
                              while (onSnake(sf) || samePos(sf, food));
                      specialFood = sf;
                      // Auto-remove after 8 seconds
                      setTimeout(() => { specialFood = null; }, 8000);
              }

              if (score > best) {
                      best = score;
                      localStorage.setItem('snakeBest', best);
              }
        } else if (specialFood && samePos(head, specialFood)) {
              score += level * 50;
              spawnParticles(specialFood.x, specialFood.y, '#ffcc00');
              specialFood = null;
              if (score > best) {
                      best = score;
                      localStorage.setItem('snakeBest', best);
              }
        } else {
              snake.pop();
        }

        updateHUD();
    }

    // ─── LEVEL FLASH ───────────────────────────────────────────
    let flashAlpha = 0;
    function flashLevel() {
        flashAlpha = 1;
    }

    // ─── DIE ───────────────────────────────────────────────────
    function die() {
        state = 'DEAD';
        // Explode head
        spawnParticles(snake[0].x, snake[0].y, '#ff4466');
        for (let i = 0; i < 5; i++) {
              setTimeout(() => {
                      if (snake[i]) spawnParticles(snake[i].x, snake[i].y, '#ff446680');
              }, i * 60);
        }
    }

    // ─── MAIN LOOP ─────────────────────────────────────────────
    function loop(now) {
        animId = requestAnimationFrame(loop);

        // Background
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawGrid();

        if (state === 'RUNNING') {
              if (now - lastTick >= getSpeed()) {
                      tick();
                      lastTick = now;
              }
        }

        updateParticles();

        if (state !== 'START') {
              drawFood();
              drawSnake();
              drawParticles();
        }

        // Level flash overlay
        if (flashAlpha > 0) {
              ctx.save();
              ctx.globalAlpha = flashAlpha * 0.35;
              ctx.fillStyle = '#00ff88';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.globalAlpha = flashAlpha;
              ctx.fillStyle = '#00ff88';
              ctx.font = 'bold 36px Segoe UI';
              ctx.textAlign = 'center';
              ctx.shadowColor = '#00ff88';
              ctx.shadowBlur = 20;
              ctx.fillText('LEVEL ' + level + '!', canvas.width/2, canvas.height/2);
              ctx.restore();
              flashAlpha = Math.max(0, flashAlpha - 0.025);
        }

        // Screens
        if (state === 'START') {
              drawGrid();
              // Draw demo snake
              ctx.fillStyle = '#00ff8820';
              for (let i = 0; i < COLS; i++) for (let j = 0; j < ROWS; j++) {
                      if ((i + j) % 4 === 0) drawCell(i, j, '#00ff8806', false, 2);
              }
              drawOverlay('🐍 SNAKE', ['Press Enter or tap to start', 'Arrow Keys / WASD to move', 'Eat ❤️ for points  |  ⭐ for bonus x5']);
        } else if (state === 'PAUSED') {
              drawOverlay('⏸ PAUSED', ['Press P or Enter to resume']);
        } else if (state === 'DEAD') {
              drawParticles();
              drawOverlay('GAME OVER', [
                      'Score: ' + score + '  |  Best: ' + best,
                      'Level reached: ' + level,
                      '',
                      'Press Enter to play again'
                    ]);
        }
    }

    // ─── INPUT ─────────────────────────────────────────────────
    const DIRS = {
        ArrowUp:    { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
        ArrowDown:  { x: 0, y:  1 }, s: { x: 0, y:  1 }, S: { x: 0, y:  1 },
        ArrowLeft:  { x:-1, y:  0 }, a: { x:-1, y:  0 }, A: { x:-1, y:  0 },
        ArrowRight: { x: 1, y:  0 }, d: { x: 1, y:  0 }, D: { x: 1, y:  0 }
    };

    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
              if (state === 'START' || state === 'DEAD') { init(); return; }
              if (state === 'PAUSED') { state = 'RUNNING'; lastTick = performance.now(); return; }
        }
        if ((e.key === 'p' || e.key === 'P') && state === 'RUNNING') {
              state = 'PAUSED'; return;
        }
        if ((e.key === 'p' || e.key === 'P') && state === 'PAUSED') {
              state = 'RUNNING'; lastTick = performance.now(); return;
        }
        const d = DIRS[e.key];
        if (d && state === 'RUNNING') {
              // Prevent reversing
              if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
              if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
        }
    });

    // Touch controls
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (state === 'START' || state === 'DEAD') { init(); return; }
        if (state === 'PAUSED') { state = 'RUNNING'; lastTick = performance.now(); }
    }, { passive: false });

    let touchStartX, touchStartY;
    canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, { passive: true });
    canvas.addEventListener('touchend', e => {
        if (state !== 'RUNNING') return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        let d;
        if (Math.abs(dx) > Math.abs(dy)) d = dx > 0 ? DIRS.ArrowRight : DIRS.ArrowLeft;
        else d = dy > 0 ? DIRS.ArrowDown : DIRS.ArrowUp;
        if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
    }, { passive: true });

    // Mobile buttons
    document.getElementById('btn-up').addEventListener('click',    () => setDir(DIRS.ArrowUp));
    document.getElementById('btn-down').addEventListener('click',  () => setDir(DIRS.ArrowDown));
    document.getElementById('btn-left').addEventListener('click',  () => setDir(DIRS.ArrowLeft));
    document.getElementById('btn-right').addEventListener('click', () => setDir(DIRS.ArrowRight));

    function setDir(d) {
        if (state === 'START' || state === 'DEAD') { init(); return; }
        if (state === 'RUNNING' && (d.x !== -dir.x || d.y !== -dir.y)) nextDir = d;
    }

    // ─── BOOT ──────────────────────────────────────────────────
    best = parseInt(localStorage.getItem('snakeBest') || '0');
    document.getElementById('best-display').textContent = best;
    state = 'START';
    requestAnimationFrame(loop);
  </script>
  </body>
</html>html>
  </script></h1>
  </body>
  </style></title>
