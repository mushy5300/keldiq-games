<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 | Keldiq Games</title>
<meta name="description" content="Play 2048 free online at Keldiq Games.">
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#071426,#0b2447,#123a6d);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.game{width:100%;max-width:470px;text-align:center}
h1{font-size:58px;margin:0;color:#fff}
.brand{color:#39a0ff;font-weight:bold;margin-bottom:18px}
.stats{display:flex;justify-content:center;gap:12px;margin:15px 0}
.stat{
  background:#102d50;
  padding:10px 18px;
  border-radius:10px;
  min-width:110px;
}
.stat span{display:block;font-size:22px;font-weight:bold}
button{
  border:0;
  background:#1687ff;
  color:white;
  font-weight:bold;
  padding:11px 20px;
  border-radius:9px;
  cursor:pointer;
  font-size:15px;
  margin-bottom:18px;
}
.board{
  background:#081b30;
  border:4px solid #1c568d;
  border-radius:14px;
  padding:10px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  touch-action:none;
}
.tile{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  background:#163653;
  font-size:30px;
  font-weight:bold;
}
.n2{background:#dce8f2;color:#17324d}
.n4{background:#bfdcf5;color:#17324d}
.n8{background:#56aaf5}
.n16{background:#258af0}
.n32{background:#0870d1}
.n64{background:#0057a8}
.n128{background:#7c56e8}
.n256{background:#9b42dd}
.n512{background:#c52fca}
.n1024{background:#e02d87}
.n2048{background:#ffb000;color:#14243b}
.help{font-size:14px;color:#b9d5ee;margin-top:17px;line-height:1.5}
a{color:#49a9ff}
.message{
  display:none;
  margin:12px 0;
  font-size:22px;
  font-weight:bold;
}
</style>
</head>
<body>

<div class="game">
  <div class="brand">KELDIQ GAMES</div>
  <h1>2048</h1>

  <div class="stats">
    <div class="stat">SCORE<span id="score">0</span></div>
    <div class="stat">BEST<span id="best">0</span></div>
  </div>

  <button onclick="newGame()">NEW GAME</button>

  <div id="message" class="message"></div>
  <div id="board" class="board"></div>

  <div class="help">
    Use your <b>arrow keys</b> or <b>swipe</b> on mobile.<br>
    Combine matching numbers and try to reach <b>2048!</b><br><br>
    <a href="/">← Back to Keldiq Games</a>
  </div>
</div>

<script>
const size=4;
let grid=[];
let score=0;
let won=false;
const board=document.getElementById("board");
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const message=document.getElementById("message");

function getBest(){
  return Number(localStorage.getItem("keldiq2048Best")||0);
}

function newGame(){
  grid=Array.from({length:size},()=>Array(size).fill(0));
  score=0;
  won=false;
  message.style.display="none";
  addTile();
  addTile();
  render();
}

function emptyCells(){
  const cells=[];
  for(let r=0;r<size;r++)
    for(let c=0;c<size;c++)
      if(grid[r][c]===0) cells.push([r,c]);
  return cells;
}

function addTile(){
  const cells=emptyCells();
  if(!cells.length)return;
  const [r,c]=cells[Math.floor(Math.random()*cells.length)];
  grid[r][c]=Math.random()<0.9?2:4;
}

function render(){
  board.innerHTML="";
  grid.flat().forEach(v=>{
    const tile=document.createElement("div");
    tile.className="tile"+(v?" n"+Math.min(v,2048):"");
    tile.textContent=v||"";
    board.appendChild(tile);
  });

  scoreEl.textContent=score;

  if(score>getBest())
    localStorage.setItem("keldiq2048Best",score);

  bestEl.textContent=getBest();

  if(!won && grid.flat().includes(2048)){
    won=true;
    message.textContent="🎉 YOU REACHED 2048!";
    message.style.display="block";
  }

  if(!canMove()){
    message.textContent="GAME OVER";
    message.style.display="block";
  }
}

function slide(row){
  let arr=row.filter(v=>v);

  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){
      arr[i]*=2;
      score+=arr[i];
      arr.splice(i+1,1);
    }
  }

  while(arr.length<size)arr.push(0);
  return arr;
}

function moveLeft(){
  let changed=false;
  const next=grid.map(row=>{
    const n=slide(row);
    if(n.some((v,i)=>v!==row[i]))changed=true;
    return n;
  });
  if(changed){grid=next;afterMove();}
}

function moveRight(){
  let changed=false;
  const next=grid.map(row=>{
    const rev=[...row].reverse();
    const n=slide(rev).reverse();
    if(n.some((v,i)=>v!==row[i]))changed=true;
    return n;
  });
  if(changed){grid=next;afterMove();}
}

function transpose(g){
  return g[0].map((_,c)=>g.map(row=>row[c]));
}

function moveUp(){
  const old=JSON.stringify(grid);
  let t=transpose(grid);
  t=t.map(row=>slide(row));
  grid=transpose(t);
  if(JSON.stringify(grid)!==old)afterMove();
}

function moveDown(){
  const old=JSON.stringify(grid);
  let t=transpose(grid);
  t=t.map(row=>slide([...row].reverse()).reverse());
  grid=transpose(t);
  if(JSON.stringify(grid)!==old)afterMove();
}

function afterMove(){
  addTile();
  render();
}

function canMove(){
  if(emptyCells().length)return true;

  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      if(c<size-1 && grid[r][c]===grid[r][c+1])return true;
      if(r<size-1 && grid[r][c]===grid[r+1][c])return true;
    }
  }
  return false;
}

document.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key))
    e.preventDefault();

  if(e.key==="ArrowLeft")moveLeft();
  if(e.key==="ArrowRight")moveRight();
  if(e.key==="ArrowUp")moveUp();
  if(e.key==="ArrowDown")moveDown();
});

let startX=0,startY=0;

board.addEventListener("pointerdown",e=>{
  startX=e.clientX;
  startY=e.clientY;
});

board.addEventListener("pointerup",e=>{
  const dx=e.clientX-startX;
  const dy=e.clientY-startY;

  if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;

  if(Math.abs(dx)>Math.abs(dy))
    dx>0?moveRight():moveLeft();
  else
    dy>0?moveDown():moveUp();
});

newGame();
</script>

</body>
</html>
